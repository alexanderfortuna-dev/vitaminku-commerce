# VitaminKu — Database & Rilis Website. Dijalankan manual (Run workflow); tidak ada pemicu push/cron.
# Semua kunci dari GitHub Secrets; tidak ada yang dicetak. Nama mode lama (verify/migrate/deploy/invite/bootstrap)
# masih diterima satu rilis lagi sebagai alias.
name: VitaminKu — Database & Rilis Website

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "cek-saja = periksa database (aman) · pasang-database = pasang migrasi · rilis-website = tayangkan ke Vercel · undang-staf = kirim undangan email · aktifkan-peran = jadikan owner/manajer"
        type: choice
        options: [cek-saja, pasang-database, rilis-website, undang-staf, aktifkan-peran, verify, migrate, deploy, invite, bootstrap]
        default: cek-saja
      confirm:
        description: 'Ketik JALANKAN untuk semua mode selain cek-saja'
        type: string
        default: ""
      kings_email:
        description: "Email Owner (untuk undang-staf / aktifkan-peran)"
        type: string
        default: ""
      livita_email:
        description: "Email Co-Owner (boleh kosong)"
        type: string
        default: ""
      admin_email:
        description: "Email General Manager (boleh kosong)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: vitaminku-db
  cancel-in-progress: false

jobs:
  db:
    name: ${{ inputs.mode }}
    if: ${{ !contains(fromJSON('["rilis-website","deploy"]'), inputs.mode) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODE: ${{ inputs.mode }}
      CONFIRM: ${{ inputs.confirm }}
      KINGS_EMAIL: ${{ inputs.kings_email }}
      LIVITA_EMAIL: ${{ inputs.livita_email }}
      ADMIN_EMAIL: ${{ inputs.admin_email }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: "15"
    steps:
      - name: Cek kunci (hanya ada/kosong, nilai tidak dibaca)
        env:
          K_SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL != '' }}
          K_SUPABASE_URL: ${{ secrets.SUPABASE_URL != '' }}
          K_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY != '' }}
          K_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
          K_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          K_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          {
            echo "### Kunci di GitHub (Repository secrets)"
            echo "| Nama | Status |"; echo "|---|---|"
            for n in SUPABASE_DB_URL SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY VERCEL_TOKEN ANTHROPIC_API_KEY; do
              v="K_$n"; if [ "${!v}" = "true" ]; then echo "| $n | ✅ ada |"; else echo "| $n | ❌ kosong / tidak terbaca |"; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          for n in SUPABASE_DB_URL SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY VERCEL_TOKEN ANTHROPIC_API_KEY; do
            v="K_$n"; echo "$n=${!v}"
          done

      - name: Penjaga (branch & konfirmasi)
        id: guard
        run: |
          if [ "$GITHUB_REF" != "refs/heads/fix/vitaminku-launch-v2" ]; then
            echo "### ❌ Ditolak: pilih branch fix/vitaminku-launch-v2" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          if [ "$MODE" != "cek-saja" ] && [ "$MODE" != "verify" ] && [ "$CONFIRM" != "JALANKAN" ]; then
            echo "### ❌ Ditolak: untuk mode $MODE ketik JALANKAN di kolom confirm" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "### ❌ Secret SUPABASE_DB_URL belum dipasang (lihat docs/TOMBOL_HP.md)" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          for e in "$KINGS_EMAIL" "$LIVITA_EMAIL" "$ADMIN_EMAIL"; do
            if [ -n "$e" ] && ! printf '%s' "$e" | grep -Eq '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'; then
              echo "### ❌ Format email tidak valid" >> "$GITHUB_STEP_SUMMARY"; exit 1
            fi
          done

      - name: Periksa bentuk alamat database (nilai tidak dicetak)
        run: |
          u="$SUPABASE_DB_URL"
          # Rapikan spasi, baris baru, dan tanda kutip yang ikut tersalin di awal/akhir.
          u="$(printf '%s' "$u" | tr -d '\r\n' | sed -E "s/^[[:space:]\"']+//; s/[[:space:]\"']+$//")"
          echo "::add-mask::$u"
          ok=1; out=""
          chk() { if [ "$1" = 1 ]; then out="$out\n| $2 | ✅ |"; else out="$out\n| $2 | ❌ $3 |"; ok=0; fi; }
          case "$u" in postgresql://*|postgres://*) a=1 ;; *) a=0 ;; esac
          chk $a "Diawali postgresql://" "isi kunci harus alamat lengkap, bukan hanya password"
          case "$u" in *"://postgres.vmhoohfwjtsojgcvopaf:"*) a=1 ;; *) a=0 ;; esac
          chk $a "Pengguna postgres.vmhoohfwjtsojgcvopaf" "bagian setelah :// harus postgres.vmhoohfwjtsojgcvopaf:"
          case "$u" in *"@aws-"*".pooler.supabase.com:5432/postgres") a=1 ;; *) a=0 ;; esac
          chk $a "Diakhiri @aws-…pooler.supabase.com:5432/postgres" "salin alamat Session pooler apa adanya"
          case "$u" in *PASSWORD_BARU*|*YOUR-PASSWORD*|*"["*|*"]"*) a=0 ;; *) a=1 ;; esac
          chk $a "Password sudah diganti" "kata PASSWORD_BARU / [YOUR-PASSWORD] atau tanda [ ] masih ada"
          case "$u" in *" "*) a=0 ;; *) a=1 ;; esac
          chk $a "Tanpa spasi di tengah" "hapus spasi di dalam alamat"
          { echo "### Bentuk alamat database"; echo "| Cek | Hasil |"; echo "|---|---|"; printf '%b\n' "$out"; } >> "$GITHUB_STEP_SUMMARY"
          printf '%b\n' "$out"
          [ "$ok" = 1 ] || exit 1
          echo "SUPABASE_DB_URL=$u" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: fix/vitaminku-launch-v2
          persist-credentials: false

      - name: Pasang psql
        id: psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null && psql --version

      - name: Pasang database (satu transaksi, satu folder migrasi)
        if: ${{ contains(fromJSON('["pasang-database","migrate"]'), inputs.mode) }}
        run: |
          # Produksi sudah memuat migrasi s/d 0009. Semua file 0010+ idempoten, dipasang berurutan dalam SATU transaksi.
          files=$(ls drizzle/migrations/[0-9][0-9][0-9][0-9]_*.sql | sort | awk -F/ '{ if (substr($NF,1,4)+0 >= 10) print }')
          args=""; for f in $files; do args="$args -f $f"; done
          if psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --single-transaction -q $args > /tmp/migrate.log 2>&1; then
            echo "### ✅ Database terpasang (satu transaksi): $(echo $files | wc -w) file migrasi" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ Pemasangan GAGAL — tidak ada yang berubah (transaksi dibatalkan)" >> "$GITHUB_STEP_SUMMARY"
            grep -E "ERROR|psql:" /tmp/migrate.log | head -5 | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Undang staf (email undangan)
        if: ${{ contains(fromJSON('["undang-staf","invite"]'), inputs.mode) }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SERVICE_KEY" ]; then
            echo "### ❌ Secret SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY belum dipasang" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          mask() { printf '%s***@%s' "${1:0:1}" "${1#*@}"; }
          q=""; [ -n "$SITE_URL" ] && q="?redirect_to=$(printf '%s' "${SITE_URL%/}/masuk" | jq -sRr @uri)"
          echo "### Undangan" >> "$GITHUB_STEP_SUMMARY"
          echo "| Email | Hasil |" >> "$GITHUB_STEP_SUMMARY"; echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          fail=0
          for e in "$KINGS_EMAIL" "$LIVITA_EMAIL" "$ADMIN_EMAIL"; do
            [ -z "$e" ] && continue
            m=$(mask "$e")
            ada=$(echo "select count(*) from auth.users where lower(email)=lower(:'e');" | psql "$SUPABASE_DB_URL" -tAq -v e="$e" 2>/dev/null || echo "?")
            if [ "$ada" = "1" ]; then echo "| $m | sudah terdaftar — dilewati |" >> "$GITHUB_STEP_SUMMARY"; continue; fi
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "${SUPABASE_URL%/}/auth/v1/invite${q}" \
              -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" -H "Content-Type: application/json" \
              --data "$(jq -cn --arg e "$e" '{email:$e}')")
            if [ "$code" = "200" ]; then echo "| $m | ✅ terkirim |" >> "$GITHUB_STEP_SUMMARY"
            else echo "| $m | ❌ gagal (kode $code) |" >> "$GITHUB_STEP_SUMMARY"; fail=1; fi
          done
          exit $fail

      - name: Aktifkan peran
        if: ${{ contains(fromJSON('["aktifkan-peran","bootstrap"]'), inputs.mode) }}
        run: |
          if ! psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 --single-transaction -q -P footer=off \
              -v kings_email="$KINGS_EMAIL" -v livita_email="$LIVITA_EMAIL" -v admin_email="$ADMIN_EMAIL" \
              -A -F ' | ' -f supabase/operasi/aktifkan-peran.sql > /tmp/boot.log 2>&1; then
            echo "### ❌ Aktifkan peran GAGAL — tidak ada yang berubah" >> "$GITHUB_STEP_SUMMARY"
            grep -E "ERROR" /tmp/boot.log | head -3 | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          echo "### Peran aktif" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat /tmp/boot.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Akun yang belum muncul = belum pernah klik email undangan / login sekali." >> "$GITHUB_STEP_SUMMARY"

      - name: Verifikasi (hanya baca)
        if: ${{ !cancelled() && steps.guard.outcome == 'success' && steps.psql.outcome == 'success' }}
        run: |
          if ! psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -tAq -F '|' -f supabase/operasi/cek-database.sql > /tmp/verify.txt 2>/tmp/verify.err; then
            e=$(cat /tmp/verify.err)
            case "$e" in
              *"password authentication failed"*) why="Password database salah. Reset password di Supabase lalu perbarui SUPABASE_DB_URL." ;;
              *"Tenant or user not found"*) why="Nama pengguna salah. Bagian sebelum ':' harus postgres.vmhoohfwjtsojgcvopaf (salin dari Session pooler)." ;;
              *"could not translate host name"*|*"Name or service not known"*) why="Alamat server salah ketik. Salin ulang Session pooler dari tombol Connect." ;;
              *"Network is unreachable"*|*"No route to host"*) why="Memakai alamat Direct connection. Ganti dengan alamat Session pooler." ;;
              *"invalid URI"*|*"invalid integer value"*|*"invalid connection option"*|*"missing"*"="*) why="Format alamat rusak (mungkin tanda [ ] masih ada atau password berisi simbol). Pakai password huruf+angka saja." ;;
              *"timeout"*|*"timed out"*) why="Server tidak menjawab. Pastikan memakai Session pooler (port 5432)." ;;
              *) why="Alasan lain (lihat baris di bawah)." ;;
            esac
            {
              echo "### ❌ Tidak bisa terhubung ke database"
              echo "**Penyebab:** $why"
              echo '```'
              # Baris galat psql, disaring: tanpa alamat, pengguna, atau password.
              head -3 /tmp/verify.err | sed -E 's#[a-z]+://[^ ]+#<alamat disembunyikan>#g; s#"[^"]*@[^"]*"#"<disembunyikan>"#g; s#(user|host|server|database) "[^"]*"#\1 "<disembunyikan>"#g'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Penyebab: $why"
            head -3 /tmp/verify.err | sed -E 's#[a-z]+://[^ ]+#<alamat disembunyikan>#g; s#"[^"]*@[^"]*"#"<disembunyikan>"#g; s#(user|host|server|database) "[^"]*"#\1 "<disembunyikan>"#g'
            exit 1
          fi
          {
            echo "### Hasil pemeriksaan VitaminKu"
            echo "| Cek | Hasil | Detail |"
            echo "|---|---|---|"
            while IFS='|' read -r cek hasil detail; do
              ikon="⚪"; [ "$hasil" = "LULUS" ] && ikon="✅"; [ "$hasil" = "GAGAL" ] && ikon="❌"
              echo "| $cek | $ikon $hasil | $detail |"
            done < /tmp/verify.txt
          } >> "$GITHUB_STEP_SUMMARY"
          if { [ "$MODE" = "pasang-database" ] || [ "$MODE" = "migrate" ]; } && grep -q '|GAGAL|' /tmp/verify.txt; then exit 1; fi

  deploy:
    name: rilis website ke Vercel
    if: ${{ contains(fromJSON('["rilis-website","deploy"]'), inputs.mode) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONFIRM: ${{ inputs.confirm }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
      V_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      V_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      V_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      V_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      V_SITE_URL: ${{ secrets.SITE_URL }}
    steps:
      - name: Penjaga
        run: |
          if [ "$GITHUB_REF" != "refs/heads/fix/vitaminku-launch-v2" ]; then
            echo "### ❌ Ditolak: pilih branch fix/vitaminku-launch-v2" >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
          if [ "$CONFIRM" != "JALANKAN" ]; then
            echo "### ❌ Ditolak: ketik JALANKAN di kolom confirm" >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
          miss=""
          for n in VERCEL_TOKEN V_SUPABASE_URL V_SUPABASE_PUBLISHABLE_KEY V_SUPABASE_SERVICE_ROLE_KEY; do
            [ -z "${!n}" ] && miss="$miss ${n#V_}"
          done
          if [ -n "$miss" ]; then echo "### ❌ Secret belum dipasang:$miss" >> "$GITHUB_STEP_SUMMARY"; exit 1; fi

      - uses: actions/checkout@v4
        with:
          ref: fix/vitaminku-launch-v2
          persist-credentials: false

      - name: Buat/sambungkan proyek "vitaminku" (terpisah dari NoLimit System)
        run: |
          scope=""; [ -n "$VERCEL_SCOPE" ] && scope="--scope $VERCEL_SCOPE"
          npx --yes vercel@latest link --yes --project vitaminku --token "$VERCEL_TOKEN" $scope > /tmp/link.log 2>&1 || { tail -5 /tmp/link.log; exit 1; }
          echo "### ✅ Proyek Vercel: vitaminku (NoLimit System tidak disentuh)" >> "$GITHUB_STEP_SUMMARY"

      - name: Isi variabel lingkungan (nilai tidak dicetak)
        run: |
          scope=""; [ -n "$VERCEL_SCOPE" ] && scope="--scope $VERCEL_SCOPE"
          put() { [ -z "$2" ] && return 0
            printf '%s' "$2" | npx --yes vercel@latest env add "$1" production --force --token "$VERCEL_TOKEN" $scope >/dev/null 2>&1 \
              && echo "| $1 | ✅ |" >> "$GITHUB_STEP_SUMMARY" || { echo "| $1 | ❌ |" >> "$GITHUB_STEP_SUMMARY"; return 1; }; }
          echo "| Variabel | Status |" >> "$GITHUB_STEP_SUMMARY"; echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          put SUPABASE_URL "$V_SUPABASE_URL"
          put VITE_SUPABASE_URL "$V_SUPABASE_URL"
          put SUPABASE_PUBLISHABLE_KEY "$V_SUPABASE_PUBLISHABLE_KEY"
          put VITE_SUPABASE_PUBLISHABLE_KEY "$V_SUPABASE_PUBLISHABLE_KEY"
          put SUPABASE_SERVICE_ROLE_KEY "$V_SUPABASE_SERVICE_ROLE_KEY"
          put ANTHROPIC_API_KEY "$V_ANTHROPIC_API_KEY"
          put SITE_URL "$V_SITE_URL"
          put VITE_SITE_URL "$V_SITE_URL"

      - name: Deploy produksi
        run: |
          scope=""; [ -n "$VERCEL_SCOPE" ] && scope="--scope $VERCEL_SCOPE"
          url=$(npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" $scope 2>/tmp/deploy.err | tail -1)
          if [ -z "$url" ]; then echo "### ❌ Deploy gagal" >> "$GITHUB_STEP_SUMMARY"; grep -iE "error" /tmp/deploy.err | head -5; exit 1; fi
          echo "### ✅ Situs tayang: $url" >> "$GITHUB_STEP_SUMMARY"
