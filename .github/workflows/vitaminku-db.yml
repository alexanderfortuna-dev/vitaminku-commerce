# VitaminKu — Database & Rilis Website. Dijalankan manual (Run workflow); tidak ada pemicu push/cron.
# Semua kunci dari GitHub Secrets; tidak ada yang dicetak. Nama mode lama (verify/migrate/deploy/invite/bootstrap)
# masih diterima satu rilis lagi sebagai alias.
name: VitaminKu — Database & Rilis Website

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "cek-saja = periksa database (aman) · pasang-database = pasang migrasi · rilis-website = tayangkan ke Vercel · undang-staf = kirim undangan email · aktifkan-peran = jadikan owner/manajer"
        type: choice
        options: [cek-saja, pasang-database, rilis-website, undang-staf, aktifkan-peran, verify, migrate, deploy, invite, bootstrap]
        default: cek-saja
      confirm:
        description: 'Ketik JALANKAN untuk semua mode selain cek-saja'
        type: string
        default: ""
      kings_email:
        description: "Email Owner (untuk undang-staf / aktifkan-peran)"
        type: string
        default: ""
      livita_email:
        description: "Email Co-Owner (boleh kosong)"
        type: string
        default: ""
      admin_email:
        description: "Email General Manager (boleh kosong)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: vitaminku-db
  cancel-in-progress: false

jobs:
  db:
    name: ${{ inputs.mode }}
    if: ${{ !contains(fromJSON('["rilis-website","deploy"]'), inputs.mode) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODE: ${{ inputs.mode }}
      CONFIRM: ${{ inputs.confirm }}
      KINGS_EMAIL: ${{ inputs.kings_email || secrets.OWNER_EMAIL }}
      LIVITA_EMAIL: ${{ inputs.livita_email }}
      ADMIN_EMAIL: ${{ inputs.admin_email }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: "15"
    steps:
      - name: Cek kunci (hanya ada/kosong, nilai tidak dibaca)
        env:
          K_SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL != '' }}
          K_SUPABASE_URL: ${{ secrets.SUPABASE_URL != '' }}
          K_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY != '' }}
          K_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
          K_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          K_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          {
            echo "### Kunci di GitHub (Repository secrets)"
            echo "| Nama | Status |"; echo "|---|---|"
            for n in SUPABASE_DB_URL SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY VERCEL_TOKEN ANTHROPIC_API_KEY; do
              v="K_$n"; if [ "${!v}" = "true" ]; then echo "| $n | ✅ ada |"; else echo "| $n | ❌ kosong / tidak terbaca |"; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          for n in SUPABASE_DB_URL SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY VERCEL_TOKEN ANTHROPIC_API_KEY; do
            v="K_$n"; echo "$n=${!v}"
          done

      - name: Penjaga (branch & konfirmasi)
        id: guard
        run: |
          if [ "$GITHUB_REF" != "refs/heads/fix/vitaminku-launch-v2" ]; then
            echo "### ❌ Ditolak: pilih branch fix/vitaminku-launch-v2" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          if [ "$MODE" != "cek-saja" ] && [ "$MODE" != "verify" ] && [ "$CONFIRM" != "JALANKAN" ]; then
            echo "### ❌ Ditolak: untuk mode $MODE ketik JALANKAN di kolom confirm" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "### ❌ Secret SUPABASE_DB_URL belum dipasang (lihat docs/TOMBOL_HP.md)" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          for e in "$KINGS_EMAIL" "$LIVITA_EMAIL" "$ADMIN_EMAIL"; do
            if [ -n "$e" ] && ! printf '%s' "$e" | grep -Eq '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'; then
              echo "### ❌ Format email tidak valid" >> "$GITHUB_STEP_SUMMARY"; exit 1
            fi
          done

      - name: Periksa bentuk alamat database (nilai tidak dicetak)
        run: |
          u="$SUPABASE_DB_URL"
          # Rapikan spasi, baris baru, dan tanda kutip yang ikut tersalin di awal/akhir.
          u="$(printf '%s' "$u" | tr -d '\r\n' | sed -E "s/^[[:space:]\"']+//; s/[[:space:]\"']+$//")"
          echo "::add-mask::$u"
          ok=1; out=""
          chk() { if [ "$1" = 1 ]; then out="$out\n| $2 | ✅ |"; else out="$out\n| $2 | ❌ $3 |"; ok=0; fi; }
          case "$u" in postgresql://*|postgres://*) a=1 ;; *) a=0 ;; esac
          chk $a "Diawali postgresql://" "isi kunci harus alamat lengkap, bukan hanya password"
          case "$u" in *"://postgres.vmhoohfwjtsojgcvopaf:"*) a=1 ;; *) a=0 ;; esac
          chk $a "Pengguna postgres.vmhoohfwjtsojgcvopaf" "bagian setelah :// harus postgres.vmhoohfwjtsojgcvopaf:"
          case "$u" in *"@aws-"*".pooler.supabase.com:5432/postgres") a=1 ;; *) a=0 ;; esac
          chk $a "Diakhiri @aws-…pooler.supabase.com:5432/postgres" "salin alamat Session pooler apa adanya"
          case "$u" in *PASSWORD_BARU*|*YOUR-PASSWORD*|*"["*|*"]"*) a=0 ;; *) a=1 ;; esac
          chk $a "Password sudah diganti" "kata PASSWORD_BARU / [YOUR-PASSWORD] atau tanda [ ] masih ada"
          case "$u" in *" "*) a=0 ;; *) a=1 ;; esac
          chk $a "Tanpa spasi di tengah" "hapus spasi di dalam alamat"
          { echo "### Bentuk alamat database"; echo "| Cek | Hasil |"; echo "|---|---|"; printf '%b\n' "$out"; } >> "$GITHUB_STEP_SUMMARY"
          printf '%b\n' "$out"
          [ "$ok" = 1 ] || exit 1
          # Pecah alamat menjadi bagian terpisah (password dengan tanda khusus tidak merusak sambungan).
          rest="${u#*://}"; userinfo="${rest%@*}"; hostpart="${rest##*@}"
          U="${userinfo%%:*}"; PW="${userinfo#*:}"
          hostport="${hostpart%%/*}"; D="${hostpart#*/}"; D="${D%%\?*}"
          H="${hostport%%:*}"; PORT="${hostport##*:}"
          case "$PW" in *%[0-9A-Fa-f][0-9A-Fa-f]*) PW="$(printf '%b' "${PW//%/\\x}")" ;; esac
          echo "::add-mask::$PW"
          sym=$(printf '%s' "$PW" | tr -d 'A-Za-z0-9' | wc -c)
          echo "Bagian alamat: server=${H%%.*}…, port=$PORT, database=$D, password ${#PW} karakter (${sym} tanda khusus)"
          {
            echo "PGHOST=$H"; echo "PGPORT=$PORT"; echo "PGUSER=$U"; echo "PGDATABASE=$D"
            echo "PGPASSWORD=$PW"; echo "PGSSLMODE=require"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: fix/vitaminku-launch-v2
          persist-credentials: false

      - name: Pasang psql
        id: psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null && psql --version

      - name: Pasang database (satu transaksi, satu folder migrasi)
        if: ${{ contains(fromJSON('["pasang-database","migrate"]'), inputs.mode) }}
        run: |
          # Produksi sudah memuat migrasi s/d 0009. Semua file 0010+ idempoten, dipasang berurutan dalam SATU transaksi.
          files=$(ls drizzle/migrations/[0-9][0-9][0-9][0-9]_*.sql | sort | awk -F/ '{ if (substr($NF,1,4)+0 >= 10) print }')
          args=""; for f in $files; do args="$args -f $f"; done
          if psql -v ON_ERROR_STOP=1 --single-transaction -q $args > /tmp/migrate.log 2>&1; then
            echo "### ✅ Database terpasang (satu transaksi): $(echo $files | wc -w) file migrasi" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ Pemasangan GAGAL — tidak ada yang berubah (transaksi dibatalkan)" >> "$GITHUB_STEP_SUMMARY"
            grep -E "ERROR|psql:" /tmp/migrate.log | head -5 | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Undang staf (email undangan)
        if: ${{ contains(fromJSON('["undang-staf","invite"]'), inputs.mode) }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SERVICE_KEY" ]; then
            echo "### ❌ Secret SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY belum dipasang" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          mask() { printf '%s***@%s' "${1:0:1}" "${1#*@}"; }
          q=""; [ -n "$SITE_URL" ] && q="?redirect_to=$(printf '%s' "${SITE_URL%/}/masuk" | jq -sRr @uri)"
          echo "### Undangan" >> "$GITHUB_STEP_SUMMARY"
          echo "| Email | Hasil |" >> "$GITHUB_STEP_SUMMARY"; echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          fail=0
          for e in "$KINGS_EMAIL" "$LIVITA_EMAIL" "$ADMIN_EMAIL"; do
            [ -z "$e" ] && continue
            m=$(mask "$e")
            ada=$(echo "select count(*) from auth.users where lower(email)=lower(:'e');" | psql -tAq -v e="$e" 2>/dev/null || echo "?")
            if [ "$ada" = "1" ]; then echo "| $m | sudah terdaftar — dilewati |" >> "$GITHUB_STEP_SUMMARY"; continue; fi
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "${SUPABASE_URL%/}/auth/v1/invite${q}" \
              -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" -H "Content-Type: application/json" \
              --data "$(jq -cn --arg e "$e" '{email:$e}')")
            if [ "$code" = "200" ]; then echo "| $m | ✅ terkirim |" >> "$GITHUB_STEP_SUMMARY"
            else echo "| $m | ❌ gagal (kode $code) |" >> "$GITHUB_STEP_SUMMARY"; fail=1; fi
          done
          exit $fail

      - name: Aktifkan peran
        if: ${{ contains(fromJSON('["aktifkan-peran","bootstrap"]'), inputs.mode) }}
        run: |
          if ! psql -v ON_ERROR_STOP=1 --single-transaction -q -P footer=off \
              -v kings_email="$KINGS_EMAIL" -v livita_email="$LIVITA_EMAIL" -v admin_email="$ADMIN_EMAIL" \
              -A -F ' | ' -f supabase/operasi/aktifkan-peran.sql > /tmp/boot.log 2>&1; then
            echo "### ❌ Aktifkan peran GAGAL — tidak ada yang berubah" >> "$GITHUB_STEP_SUMMARY"
            grep -E "ERROR" /tmp/boot.log | head -3 | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          echo "### Peran aktif" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat /tmp/boot.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Akun yang belum muncul = belum pernah klik email undangan / login sekali." >> "$GITHUB_STEP_SUMMARY"

      - name: Verifikasi (hanya baca)
        if: ${{ !cancelled() && steps.guard.outcome == 'success' && steps.psql.outcome == 'success' }}
        run: |
          if ! psql -v ON_ERROR_STOP=1 -tAq -F '|' -f supabase/operasi/cek-database.sql > /tmp/verify.txt 2>/tmp/verify.err; then
            e=$(cat /tmp/verify.err)
            case "$e" in
              *"password authentication failed"*) why="Password database salah. Reset password di Supabase lalu perbarui SUPABASE_DB_URL." ;;
              *"Tenant or user not found"*) why="Nama pengguna salah. Bagian sebelum ':' harus postgres.vmhoohfwjtsojgcvopaf (salin dari Session pooler)." ;;
              *"could not translate host name"*|*"Name or service not known"*) why="Alamat server salah ketik. Salin ulang Session pooler dari tombol Connect." ;;
              *"Network is unreachable"*|*"No route to host"*) why="Memakai alamat Direct connection. Ganti dengan alamat Session pooler." ;;
              *"invalid URI"*|*"invalid integer value"*|*"invalid connection option"*|*"missing"*"="*) why="Format alamat rusak (mungkin tanda [ ] masih ada atau password berisi simbol). Pakai password huruf+angka saja." ;;
              *"timeout"*|*"timed out"*) why="Server tidak menjawab. Pastikan memakai Session pooler (port 5432)." ;;
              *) why="Alasan lain (lihat baris di bawah)." ;;
            esac
            {
              echo "### ❌ Tidak bisa terhubung ke database"
              echo "**Penyebab:** $why"
              echo '```'
              # Baris galat psql, disaring: tanpa alamat, pengguna, atau password.
              head -3 /tmp/verify.err | sed -E 's#[a-z]+://[^ ]+#<alamat disembunyikan>#g; s#"[^"]*@[^"]*"#"<disembunyikan>"#g; s#(user|host|server|database) "[^"]*"#\1 "<disembunyikan>"#g'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Penyebab: $why"
            head -3 /tmp/verify.err | sed -E 's#[a-z]+://[^ ]+#<alamat disembunyikan>#g; s#"[^"]*@[^"]*"#"<disembunyikan>"#g; s#(user|host|server|database) "[^"]*"#\1 "<disembunyikan>"#g'
            exit 1
          fi
          {
            echo "### Hasil pemeriksaan VitaminKu"
            echo "| Cek | Hasil | Detail |"
            echo "|---|---|---|"
            while IFS='|' read -r cek hasil detail; do
              ikon="⚪"; [ "$hasil" = "LULUS" ] && ikon="✅"; [ "$hasil" = "GAGAL" ] && ikon="❌"
              echo "| $cek | $ikon $hasil | $detail |"
            done < /tmp/verify.txt
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Hasil cek (juga di ringkasan):"; cat /tmp/verify.txt
          if { [ "$MODE" = "pasang-database" ] || [ "$MODE" = "migrate" ]; } && grep -q '|GAGAL|' /tmp/verify.txt; then exit 1; fi

      - name: Uji asap keamanan & pesanan (satu transaksi, selalu dibatalkan)
        if: ${{ contains(fromJSON('["cek-saja","verify"]'), inputs.mode) }}
        run: |
          psql -v ON_ERROR_STOP=1 -tAq -F '|' -f supabase/operasi/uji-asap.sql > /tmp/uji.txt
          {
            echo "### Uji asap (tidak ada data tersimpan)"
            echo "| Uji | Hasil | Detail |"
            echo "|---|---|---|"
            while IFS='|' read -r cek hasil detail; do
              ikon="✅"; [ "$hasil" = "GAGAL" ] && ikon="❌"
              echo "| $cek | $ikon $hasil | $detail |"
            done < /tmp/uji.txt
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Hasil uji asap:"; cat /tmp/uji.txt
          if grep -q '|GAGAL|' /tmp/uji.txt; then exit 1; fi

      - name: Uji situs produksi & tampilan ponsel 375px (hanya membaca halaman publik)
        if: ${{ !cancelled() && contains(fromJSON('["cek-saja","verify"]'), inputs.mode) }}
        env:
          SITE_SECRET: ${{ secrets.SITE_URL }}
          SRK: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AK: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          SITE="${SITE_SECRET:-https://vitaminku.vercel.app}"; SITE="$(printf '%s' "$SITE" | tr -d '\r\n "')"
          echo "Situs diuji: $SITE"
          SITE="$SITE" bash scripts/uji-situs.sh | tee /tmp/situs.txt; f1=${PIPESTATUS[0]}
          mkdir -p /tmp/pw && (cd /tmp/pw && npm init -y >/dev/null && npm i -s playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1)
          cp scripts/uji-situs-ponsel.mjs /tmp/pw/ && (cd /tmp/pw && SITE="$SITE" node uji-situs-ponsel.mjs) | tee -a /tmp/situs.txt; f2=${PIPESTATUS[0]}
          { echo "### Uji situs ($SITE)"; echo "| Uji | Hasil | Detail |"; echo "|---|---|---|"
            while IFS='|' read -r a b c; do echo "| $a | $b | $c |"; done < /tmp/situs.txt; } >> "$GITHUB_STEP_SUMMARY"
          [ "$f1" = 0 ] && [ "$f2" = 0 ]

  deploy:
    name: rilis website ke Vercel
    if: ${{ contains(fromJSON('["rilis-website","deploy"]'), inputs.mode) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONFIRM: ${{ inputs.confirm }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
      V_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      V_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      V_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      V_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      V_SITE_URL: ${{ secrets.SITE_URL }}
    steps:
      - name: Penjaga
        run: |
          if [ "$GITHUB_REF" != "refs/heads/fix/vitaminku-launch-v2" ]; then
            echo "### ❌ Ditolak: pilih branch fix/vitaminku-launch-v2" >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
          if [ "$CONFIRM" != "JALANKAN" ]; then
            echo "### ❌ Ditolak: ketik JALANKAN di kolom confirm" >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
          miss=""
          for n in VERCEL_TOKEN V_SUPABASE_URL V_SUPABASE_PUBLISHABLE_KEY V_SUPABASE_SERVICE_ROLE_KEY; do
            [ -z "${!n}" ] && miss="$miss ${n#V_}"
          done
          if [ -n "$miss" ]; then echo "### ❌ Secret belum dipasang:$miss" >> "$GITHUB_STEP_SUMMARY"; exit 1; fi

      - uses: actions/checkout@v4
        with:
          ref: fix/vitaminku-launch-v2
          persist-credentials: false

      - name: Rapikan kunci & cek akun Vercel (nilai tidak dicetak)
        run: |
          clean() { printf '%s' "$1" | tr -d '\r\n' | sed -E "s/^[[:space:]\"']+//; s/[[:space:]\"']+$//"; }
          for n in VERCEL_TOKEN VERCEL_SCOPE V_SUPABASE_URL V_SUPABASE_PUBLISHABLE_KEY V_SUPABASE_SERVICE_ROLE_KEY V_ANTHROPIC_API_KEY V_SITE_URL; do
            v="$(clean "${!n}")"
            [ -n "$v" ] && echo "::add-mask::$v"
            echo "C_$n=$v" >> "$GITHUB_ENV"
          done
          tok="$(clean "$VERCEL_TOKEN")"; sc="$(clean "$VERCEL_SCOPE")"
          npx --yes vercel@latest whoami --token "$tok" >/tmp/who.out 2>/tmp/who.err || true
          who=$(grep -vE '^(Vercel CLI|>)' /tmp/who.out | tail -1 | tr -d '[:space:]')
          # Token tim (jenis baru) tidak bisa membaca data pengguna: cari tim yang boleh dipakai token ini.
          if [ -z "$who" ]; then
            curl -s -H "Authorization: Bearer $tok" "https://api.vercel.com/v2/teams?limit=20" > /tmp/teams.json || true
            teams=$(jq -r '.teams[]?.slug' /tmp/teams.json 2>/dev/null | tr '\n' ' ')
            echo "Tim yang bisa dipakai token: ${teams:-(tidak ada)} · kode jawaban: $(jq -r '.error.code // "ok"' /tmp/teams.json 2>/dev/null)"
            pick=""
            for t in $teams; do [ "$t" = "$sc" ] && pick="$t"; done
            [ -z "$pick" ] && pick=$(printf '%s' "$teams" | awk '{print $1}')
            if [ -n "$pick" ]; then who="tim $pick"; sc="$pick"; fi
          fi
          # Akun Vercel baru berjalan sebagai tim bernama sama dengan akun: coba langsung lingkup itu.
          if [ -z "$who" ]; then
            for s in $sc alexanderfortuna-dev; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $tok" "https://api.vercel.com/v9/projects?slug=$s&limit=1")
              echo "Coba lingkup '$s': kode $code"
              if [ "$code" = "200" ]; then who="tim $s"; sc="$s"; break; fi
            done
          fi
          if [ -z "$who" ]; then
            alnum=$(printf '%s' "$tok" | tr -cd 'A-Za-z0-9' | wc -c); other=$((${#tok} - alnum))
            hint="Token tidak dikenal Vercel."
            [ "$other" -gt 1 ] && hint="$hint Isinya mengandung beberapa tanda/simbol: kemungkinan yang tersalin bukan token Vercel."
            [ "${#tok}" -lt 20 ] && hint="$hint Isinya terlalu pendek (${#tok} karakter) untuk sebuah token."
            {
              echo "### ❌ Token Vercel ditolak"
              echo "$hint"
              echo "Perbaikan: vercel.com/account/settings/tokens → Create Token → salin kode panjang yang muncul (hanya tampil sekali) → perbarui secret VERCEL_TOKEN."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Token: ${#tok} karakter, ${other} bukan huruf/angka. $hint"
            grep -iE "error" /tmp/who.err | head -2; exit 1
          fi
          echo "Token milik akun: $who"
          arg=""
          if [ -n "$sc" ] && npx --yes vercel@latest project ls --token "$tok" --scope "$sc" >/dev/null 2>&1; then arg="--scope $sc"; fi
          [ -z "$arg" ] && [ -n "$sc" ] && echo "Nama tim '$sc' tidak dipakai (akun pribadi) — memakai akun pemilik token."
          echo "VC_SCOPE=$arg" >> "$GITHUB_ENV"
          # ID tim/akun untuk API langsung (CLI Vercel menolak token yang tidak bisa membaca data pengguna).
          tid=""
          [ -n "$sc" ] && tid=$(curl -s -H "Authorization: Bearer $tok" "https://api.vercel.com/v2/teams/$sc" | jq -r '.id // empty')
          [ -z "$tid" ] && [ -n "$sc" ] && tid=$(curl -s -H "Authorization: Bearer $tok" "https://api.vercel.com/v9/projects?slug=$sc&limit=1" | jq -r '.projects[0].accountId // empty')
          [ -z "$tid" ] && tid=$(curl -s -H "Authorization: Bearer $tok" "https://api.vercel.com/v2/user" | jq -r '.user.defaultTeamId // .user.id // empty')
          [ -z "$tid" ] && { echo "ID tim Vercel tidak ditemukan untuk token ini."; exit 1; }
          echo "VC_TEAM=$tid" >> "$GITHUB_ENV"
          echo "### ✅ Token Vercel milik akun **$who**" >> "$GITHUB_STEP_SUMMARY"

      - name: Buat/sambungkan proyek "vitaminku" (terpisah dari NoLimit System)
        run: |
          api() { curl -s -H "Authorization: Bearer $C_VERCEL_TOKEN" -H "Content-Type: application/json" "$@"; }
          q="teamId=$VC_TEAM"
          code=$(api -o /tmp/p.json -w '%{http_code}' "https://api.vercel.com/v9/projects/vitaminku?$q")
          if [ "$code" = "404" ]; then
            code=$(api -o /tmp/p.json -w '%{http_code}' -X POST "https://api.vercel.com/v11/projects?$q" -d '{"name":"vitaminku","framework":null}')
          fi
          pid=$(jq -r 'select(.name == "vitaminku") | .id // empty' /tmp/p.json)
          if [ -z "$pid" ]; then
            echo "Proyek vitaminku tidak bisa dibaca/dibuat: kode $code · $(jq -r '.error.code // ""' /tmp/p.json) · $(jq -r '.error.message // ""' /tmp/p.json | head -c 200)"
            echo "### ❌ Proyek vitaminku tidak bisa dibuat (kode $code) — token kemungkinan hanya untuk proyek lain" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "VC_PROJECT=$pid" >> "$GITHUB_ENV"
          echo "Proyek vitaminku siap (kode $code)."
          echo "### ✅ Proyek Vercel: vitaminku (NoLimit System tidak disentuh)" >> "$GITHUB_STEP_SUMMARY"

      - name: Isi variabel lingkungan (nilai tidak dicetak)
        run: |
          api() { curl -s -H "Authorization: Bearer $C_VERCEL_TOKEN" -H "Content-Type: application/json" "$@"; }
          put() { [ -z "$2" ] && return 0
            code=$(jq -nc --arg k "$1" --arg v "$2" '{key:$k,value:$v,type:"encrypted",target:["production"]}' \
              | api -o /tmp/e.json -w '%{http_code}' -X POST "https://api.vercel.com/v10/projects/$VC_PROJECT/env?upsert=true&teamId=$VC_TEAM" --data-binary @-)
            if [ "$code" = "200" ] || [ "$code" = "201" ]; then echo "| $1 | ✅ |" >> "$GITHUB_STEP_SUMMARY"; echo "$1: tersimpan"
            else echo "| $1 | ❌ $code |" >> "$GITHUB_STEP_SUMMARY"; echo "$1: gagal $code $(jq -r '.error.code // ""' /tmp/e.json)"; return 1; fi; }
          echo "| Variabel | Status |" >> "$GITHUB_STEP_SUMMARY"; echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          put SUPABASE_URL "$C_V_SUPABASE_URL"
          put VITE_SUPABASE_URL "$C_V_SUPABASE_URL"
          put SUPABASE_PUBLISHABLE_KEY "$C_V_SUPABASE_PUBLISHABLE_KEY"
          put VITE_SUPABASE_PUBLISHABLE_KEY "$C_V_SUPABASE_PUBLISHABLE_KEY"
          put SUPABASE_SERVICE_ROLE_KEY "$C_V_SUPABASE_SERVICE_ROLE_KEY"
          put ANTHROPIC_API_KEY "$C_V_ANTHROPIC_API_KEY"
          put SITE_URL "$C_V_SITE_URL"
          put VITE_SITE_URL "$C_V_SITE_URL"

      - name: Deploy produksi
        run: |
          # Proyek sudah tertaut lewat ID: CLI tidak perlu memilih akun/tim.
          export VERCEL_ORG_ID="$VC_TEAM" VERCEL_PROJECT_ID="$VC_PROJECT"
          url=$(npx --yes vercel@latest deploy --prod --yes --token "$C_VERCEL_TOKEN" 2>/tmp/deploy.err | tail -1)
          if [ -z "$url" ]; then echo "### ❌ Deploy gagal" >> "$GITHUB_STEP_SUMMARY"; grep -iE "error" /tmp/deploy.err | head -5; exit 1; fi
          echo "### ✅ Situs tayang: $url" >> "$GITHUB_STEP_SUMMARY"
          curl -s -H "Authorization: Bearer $C_VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/${url#https://}?teamId=$VC_TEAM" > /tmp/dep.json
          site=$(jq -r '.alias[]?' /tmp/dep.json | awk '{ print length, $0 }' | sort -n | head -1 | cut -d' ' -f2)
          site="${site:+https://$site}"; site="${site:-$url}"
          echo "SITE=$site" >> "$GITHUB_ENV"
          echo "Alamat deploy: $url"; echo "Alamat toko: $site"; echo "Status: $(jq -r '.readyState // "?"' /tmp/dep.json)"; echo "Commit: $(git rev-parse HEAD)"
          echo "Alamat toko: $site · commit $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Uji asap situs (hanya membaca halaman publik)
        run: |
          SITE="$SITE" SRK="$C_V_SUPABASE_SERVICE_ROLE_KEY" AK="$C_V_ANTHROPIC_API_KEY" bash scripts/uji-situs.sh | tee /tmp/smoke.txt; fail=${PIPESTATUS[0]}
          { echo "### Uji asap situs"; echo "| Halaman | Hasil | Detail |"; echo "|---|---|---|"
            while IFS='|' read -r a b c; do echo "| $a | $b | $c |"; done < /tmp/smoke.txt; } >> "$GITHUB_STEP_SUMMARY"
          exit $fail
